<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discography</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const stored = localStorage.getItem('discography-theme');
      const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = stored || preferred;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Discography</h1>
    <div class="header-actions">
      <button class="secondary" id="newsBtn" type="button">News</button>
      <button class="secondary" id="statsBtn" type="button">Discography</button>
      <button class="secondary" id="themeToggle" type="button">Dark</button>
      <span id="dataState" class="status">loading</span>
    </div>
  </header>
  <main>
    <aside>
      <label for="search">Filter</label>
      <input id="search" type="search" placeholder="Album, song, framework">

      <div class="upload-panel">
        <label for="uploadFramework">Framework</label>
        <select id="uploadFramework"></select>

        <label for="uploadFiles">Local MP3</label>
        <input id="uploadFiles" type="file" accept=".mp3,audio/mpeg" multiple>

        <div class="upload-actions">
          <button id="analyzeUploadsBtn" type="button">Analyze Uploads</button>
          <button id="clearUploadsBtn" class="secondary" type="button">Clear Uploads</button>
        </div>
        <div id="uploadStatus" class="meta"></div>
      </div>

      <div class="album-list" id="albumList"></div>
    </aside>
    <section>
      <div id="detail" class="empty">Loading catalog...</div>
    </section>
  </main>
  <div class="global-player" id="globalPlayer">
    <div class="global-player-title">
      <strong id="playerTitle">No track selected</strong>
      <span id="playerMeta">Use a Play button to add tracks to the playlist.</span>
    </div>
    <div class="player-stage">
      <audio id="globalAudio" controls preload="metadata"></audio>
      <div class="karaoke-stage" aria-label="Timed lyrics display">
        <div class="karaoke-controls" aria-label="Lyric navigation">
          <button class="secondary" id="karaokePrevBtn" type="button" aria-label="Previous lyric line" title="Previous lyric line">↑</button>
          <button class="secondary" id="karaokeNextBtn" type="button" aria-label="Next lyric line" title="Next lyric line">↓</button>
        </div>
        <div class="karaoke-copy">
          <div class="karaoke-line previous" id="karaokePrevious"></div>
          <div class="karaoke-line current empty" id="karaokeCurrent">Timed lyrics will appear here.</div>
          <div class="karaoke-line next" id="karaokeNext"></div>
        </div>
      </div>
    </div>
    <div class="playlist" aria-label="Playlist">
      <div class="playlist-head">
        <span id="playlistCount">Playlist empty</span>
        <span>Queue</span>
      </div>
      <div class="playlist-list" id="playlistList">
        <div class="playlist-item"><div class="playlist-item-title"><span>No queued tracks.</span></div></div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
