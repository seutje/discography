<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno Pipeline</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f1;
      --panel: #ffffff;
      --ink: #20231f;
      --muted: #686e65;
      --line: #d9ddd2;
      --accent: #1d6b5f;
      --accent-2: #a43f45;
      --soft: #e9efe9;
      --warn: #8b5e14;
      --ok: #1d6b3e;
      --error: #a12b2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-bottom: 210px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-actions button {
      min-height: 32px;
      padding: 5px 10px;
    }
    .header-actions button.active {
      background: var(--accent);
      color: #fff;
    }
    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcf8;
      padding: 18px;
      overflow: auto;
    }
    section {
      padding: 20px 24px 32px;
      overflow: auto;
    }
    label {
      display: block;
      margin: 12px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
      font: inherit;
    }
    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      margin: 0;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
      color: var(--ink);
      font-weight: 600;
    }
    .check span { line-height: 1.2; }
    button {
      min-height: 36px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 7px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
    }
    button.danger {
      background: #fff;
      border-color: var(--accent-2);
      color: var(--accent-2);
    }
    button:disabled {
      opacity: .55;
      cursor: wait;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .text-analysis {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 12px;
    }
    .text-analysis h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    .text-analysis dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      margin: 8px 0;
      font-size: 12px;
    }
    .text-analysis dt {
      color: var(--muted);
      font-weight: 700;
    }
    .text-analysis dd {
      margin: 0;
      font-weight: 700;
    }
    .warnings {
      margin: 8px 0 0;
      padding-left: 17px;
      color: var(--warn);
      font-size: 12px;
    }
    .jobs {
      margin-top: 22px;
      display: grid;
      gap: 8px;
    }
    .job {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      cursor: pointer;
    }
    .job.active {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .job-title {
      font-weight: 700;
      word-break: break-word;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status.complete, .status.dry-run-complete { color: var(--ok); }
    .status.error { color: var(--error); }
    .status.running, .status.queued { color: var(--warn); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric, .iteration, .candidate, .log {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .metric {
      padding: 11px 12px;
    }
    .metric strong {
      display: block;
      font-size: 18px;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .stats-toolbar {
      display: flex;
      gap: 10px;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .stats-toolbar label {
      margin-top: 0;
    }
    .stats-select {
      min-width: 180px;
    }
    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .chart-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      min-width: 0;
    }
    .chart-panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(86px, 150px) minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-weight: 700;
    }
    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }
    .bar-fill.alt { background: #3f5fa4; }
    .bar-fill.warm { background: #a45b3f; }
    .bar-value {
      text-align: right;
      font-weight: 800;
    }
    .stats-table-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: auto;
    }
    .stats-table-wrap table {
      margin: 0;
      min-width: 760px;
    }
    .title-link {
      border: 0;
      background: transparent;
      color: var(--accent);
      min-height: 0;
      padding: 0;
      text-align: left;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .report-layout {
      display: grid;
      gap: 14px;
    }
    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 12px;
    }
    .report-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      min-width: 0;
    }
    .report-panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .report-panel ul {
      margin: 0;
      padding-left: 18px;
    }
    .report-panel li + li {
      margin-top: 5px;
    }
    .report-panel dl {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(0, 1.4fr);
      gap: 6px 12px;
      margin: 0;
      font-size: 12px;
    }
    .report-panel dt {
      color: var(--muted);
      font-weight: 800;
    }
    .report-panel dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 650;
    }
    .report-wide {
      grid-column: 1 / -1;
    }
    .iteration {
      margin-bottom: 12px;
      overflow: hidden;
    }
    .iteration-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
    }
    .iteration-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .candidate {
      padding: 12px;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .candidate.promoted {
      border-color: var(--ok);
      box-shadow: inset 3px 0 0 var(--ok);
    }
    .cover {
      width: 88px;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--soft);
      object-fit: cover;
    }
    .placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
    }
    .global-player {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(180px, 320px) minmax(0, 1fr) minmax(260px, 420px);
      gap: 14px;
      align-items: center;
      min-height: 132px;
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      background: #fbfcf8;
      box-shadow: 0 -8px 24px rgba(32, 35, 31, .08);
    }
    .global-player-title {
      min-width: 0;
    }
    .global-player-title strong,
    .global-player-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .global-player-title span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .global-player audio {
      width: 100%;
      height: 36px;
    }
    .playlist {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .playlist-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }
    .playlist-list {
      max-height: 82px;
      overflow: auto;
    }
    .playlist-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .playlist-item:last-child { border-bottom: 0; }
    .playlist-item.active {
      box-shadow: inset 3px 0 0 var(--ok);
      background: #f5faf5;
    }
    .playlist-item-title {
      min-width: 0;
    }
    .playlist-item-title strong,
    .playlist-item-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .playlist-item-title span {
      color: var(--muted);
      font-size: 11px;
      margin-top: 1px;
    }
    .playlist-item button {
      min-height: 26px;
      padding: 3px 7px;
      font-size: 12px;
    }
    button.playing {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .candidate-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .score-details {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .score-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 6px;
    }
    .score-chip {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: #fbfcf8;
    }
    .score-chip strong {
      display: block;
      font-size: 14px;
    }
    .score-chip span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 12px;
    }
    th, td {
      text-align: left;
      padding: 5px 6px;
      border-bottom: 1px solid var(--line);
    }
    th {
      color: var(--muted);
      font-weight: 800;
    }
    .log {
      margin-top: 14px;
      max-height: 220px;
      overflow: auto;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .empty {
      padding: 32px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 900px) {
      body { padding-bottom: 260px; }
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .summary { grid-template-columns: 1fr 1fr; }
      .charts { grid-template-columns: 1fr; }
      .report-grid { grid-template-columns: 1fr; }
      .candidate { grid-template-columns: 1fr; }
      .score-summary { grid-template-columns: 1fr 1fr; }
      .global-player {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 14px;
      }
      .playlist-list { max-height: 92px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Suno Pipeline</h1>
    <div class="header-actions">
      <button class="secondary active" id="jobsViewBtn" type="button">Jobs</button>
      <button class="secondary" id="statsViewBtn" type="button">Statistics</button>
      <span id="serverState" class="status">loading</span>
    </div>
  </header>
  <main>
    <aside>
      <form id="jobForm">
        <label for="songText">Seed Song</label>
        <select id="songText" required></select>

        <label for="publicBase">Public Base URL</label>
        <input id="publicBase" placeholder="https://your-domain.example">

        <div class="row">
          <div>
            <label for="threshold">Threshold</label>
            <input id="threshold" type="number" min="0" max="10" step="0.1" value="8.2">
          </div>
          <div>
            <label for="scoreMode">Score</label>
            <select id="scoreMode">
              <option value="mean_axes">Mean Axes</option>
              <option value="min_axis">Min Axis</option>
              <option value="cdpd">CDPD</option>
              <option value="nge">NGE</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="maxIterations">Iterations</label>
            <input id="maxIterations" type="number" min="1" max="20" value="3">
          </div>
          <div>
            <label for="maxCalls">API Calls</label>
            <input id="maxCalls" type="number" min="0" max="20" value="1">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="styleWeight">Style Weight</label>
            <input id="styleWeight" type="number" min="0" max="1" step="0.01" value="0.75">
          </div>
          <div>
            <label for="weirdnessConstraint">Weirdness</label>
            <input id="weirdnessConstraint" type="number" min="0" max="1" step="0.01" value="0.75">
          </div>
        </div>

        <label for="vocalGender">Vocal Gender</label>
        <select id="vocalGender">
          <option value="">Unspecified</option>
          <option value="m">Male</option>
          <option value="f">Female</option>
        </select>

        <label for="ollamaModel">Ollama Model</label>
        <input id="ollamaModel" value="qwen3:8b">

        <label class="check">
          <input id="live" type="checkbox">
          <span>Live Suno generation</span>
        </label>

        <div class="actions">
          <button id="startBtn" type="submit">Start Job</button>
          <button class="secondary" id="analyzeTextBtn" type="button">Analyze Text</button>
          <button class="secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div id="textAnalysis" class="text-analysis" hidden></div>
      </form>

      <div class="jobs" id="jobs"></div>
    </aside>
    <section>
      <div id="detail" class="empty">No job selected.</div>
    </section>
  </main>
  <div class="global-player" id="globalPlayer">
    <div class="global-player-title">
      <strong id="playerTitle">No track selected</strong>
      <span id="playerMeta">Use a Play button to add tracks to the playlist.</span>
    </div>
    <audio id="globalAudio" controls preload="metadata"></audio>
    <div class="playlist" aria-label="Playlist">
      <div class="playlist-head">
        <span id="playlistCount">Playlist empty</span>
        <span>Loops</span>
      </div>
      <div class="playlist-list" id="playlistList">
        <div class="playlist-item"><div class="playlist-item-title"><span>No queued tracks.</span></div></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      jobs: [],
      selected: null,
      busy: false,
      selectedJob: null,
      selectedSignature: '',
      view: 'jobs',
      statistics: null,
      albums: null,
      statsGroupBy: 'album',
      selectedAlbum: null,
      selectedAlbumDetail: null,
      currentTrack: null,
      playlist: [],
      currentPlaylistIndex: -1,
      playlistSerial: 0
    };

    function $(id) { return document.getElementById(id); }

    async function api(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function statusClass(status) {
      return `status ${String(status || '').replaceAll('_', '-')}`;
    }

    function fmt(value, digits = 2) {
      const num = Number(value);
      return Number.isFinite(num) ? num.toFixed(digits) : '—';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function updateViewButtons() {
      $('jobsViewBtn').classList.toggle('active', state.view === 'jobs');
      $('statsViewBtn').classList.toggle('active', state.view === 'statistics' || state.view === 'album');
    }

    async function loadSongs() {
      const data = await api('/api/songs');
      $('songText').innerHTML = data.songs.map(song =>
        `<option value="${song.path}">${song.path}</option>`
      ).join('');
    }

    async function loadConfig() {
      const data = await api('/api/config');
      if (data.public_base_url && !$('publicBase').value) {
        $('publicBase').value = data.public_base_url;
      }
    }

    async function analyzeSelectedText() {
      const panel = $('textAnalysis');
      panel.hidden = false;
      panel.innerHTML = '<h3>Text Analysis</h3><div class="meta">Analyzing seed text...</div>';
      $('analyzeTextBtn').disabled = true;
      try {
        const path = encodeURIComponent($('songText').value);
        const data = await api(`/api/text-analysis?path=${path}`);
        renderTextAnalysis(data);
      } catch (err) {
        panel.innerHTML = `<h3>Text Analysis</h3><div class="meta" style="color:var(--error)">${escapeHtml(err.message)}</div>`;
      } finally {
        $('analyzeTextBtn').disabled = false;
      }
    }

    function renderTextAnalysis(data) {
      const metrics = data.metrics || {};
      const suno = data.suno || {};
      const warnings = data.warnings || [];
      $('textAnalysis').hidden = false;
      $('textAnalysis').innerHTML = `
        <h3>${escapeHtml(data.title || 'Text Analysis')}</h3>
        <div class="meta">${escapeHtml(data.framework || 'No framework selected')}</div>
        <dl>
          <dt>Prompt chars</dt><dd>${suno.prompt_chars ?? '—'} / ${suno.prompt_limit ?? '—'}</dd>
          <dt>Style chars</dt><dd>${suno.style_chars ?? '—'} / ${suno.style_limit ?? '—'}</dd>
          <dt>Words</dt><dd>${metrics.word_count ?? '—'}</dd>
          <dt>Lines</dt><dd>${metrics.line_count ?? '—'}</dd>
          <dt>Sections</dt><dd>${metrics.section_count ?? '—'}</dd>
          <dt>Repeated lines</dt><dd>${fmt(metrics.repeated_line_ratio, 2)}</dd>
          <dt>Rhyme reuse</dt><dd>${fmt(metrics.rhyme_suffix_reuse, 2)}</dd>
          <dt>Audio target</dt><dd>${escapeHtml(data.album_audio_target || '—')}</dd>
        </dl>
        ${warnings.length ? `<ul class="warnings">${warnings.map(warning => `<li>${escapeHtml(warning)}</li>`).join('')}</ul>` : '<div class="meta" style="color:var(--ok)">Ready for Suno payload limits.</div>'}
      `;
    }

    async function loadJobs(keepSelection = true) {
      const data = await api('/api/jobs');
      state.jobs = data.jobs;
      if (!keepSelection || !state.selected) {
        state.selected = state.jobs[0]?.id || null;
      }
      renderJobs();
      if (state.selected && state.view === 'jobs') await loadJob(state.selected, { soft: true });
      $('serverState').textContent = 'online';
      $('serverState').className = 'status complete';
    }

    async function loadJob(id, options = {}) {
      const job = await api(`/api/jobs/${id}`);
      const selectionChanged = state.selected !== id;
      state.view = 'jobs';
      state.selected = id;
      updateViewButtons();
      updateDetail(job, { soft: Boolean(options.soft) && !selectionChanged });
      renderJobs();
    }

    function jobSignature(job) {
      return JSON.stringify({
        status: job.status,
        updated_at: job.updated_at,
        completed_at: job.completed_at,
        error: job.error || '',
        best: job.best?.score ?? null,
        iterations: (job.iterations || []).map(iteration => ({
          iteration: iteration.iteration,
          status: iteration.status,
          text_path: iteration.text_path || '',
          candidates: (iteration.candidates || []).map(candidate => ({
            index: candidate.index,
            score: candidate.score ?? null,
            audio_path: candidate.audio_path || '',
            report_path: candidate.report_path || '',
            analysis_status: candidate.analysis_status || '',
            axes: candidate.axes || {},
            core_metrics: candidate.core_metrics || {},
            rung_estimate: candidate.rung_estimate || null,
            promoted: Boolean(candidate.promoted),
            album_audio_path: candidate.album_audio_path || ''
          }))
        })),
        winner: job.winner || null
      });
    }

    function updateDetail(job, { soft = false } = {}) {
      const signature = jobSignature(job);
      state.selectedJob = job;
      if (soft && signature === state.selectedSignature) {
        return;
      }
      state.selectedSignature = signature;
      renderDetail(job);
    }

    function updateTextOnly(job) {
      const status = document.querySelector('#detail [data-job-status]');
      if (status) {
        status.textContent = job.status || 'unknown';
        status.className = statusClass(job.status);
      }
      const best = document.querySelector('#detail [data-best-score]');
      if (best) best.textContent = fmt(job.best?.score, 3);
      for (const iteration of job.iterations || []) {
        const iterationsRoot = document.querySelector('#detail [data-iterations]');
        if (!document.querySelector(`#detail [data-iteration="${iteration.iteration}"]`) && iterationsRoot) {
          const empty = iterationsRoot.querySelector('.empty');
          if (empty) empty.remove();
          iterationsRoot.insertAdjacentHTML('beforeend', renderIteration(iteration));
        }
        const iterationStatus = document.querySelector(`#detail [data-iteration-status="${iteration.iteration}"]`);
        if (iterationStatus) {
          iterationStatus.textContent = iteration.status || 'pending';
          iterationStatus.className = statusClass(iteration.status);
        }
        for (const candidate of iteration.candidates || []) {
          const key = candidateKey(iteration.iteration, candidate.index);
          let row = document.querySelector(`#detail [data-candidate-key="${key}"]`);
          if (!row) {
            const body = document.querySelector(`#detail [data-iteration-body="${iteration.iteration}"]`);
            if (!body) continue;
            const empty = body.querySelector('[data-candidates-empty]');
            if (empty) empty.remove();
            body.insertAdjacentHTML('beforeend', renderCandidate(candidate, iteration.iteration));
            row = document.querySelector(`#detail [data-candidate-key="${key}"]`);
            if (!row) continue;
          }
          const score = row.querySelector('[data-score-status]');
          if (score) score.textContent = candidateStatusText(candidate);
          const report = row.querySelector('[data-report-link]');
          if (report) report.innerHTML = reportLink(candidate);
          const details = row.querySelector('[data-score-details]');
          if (details) details.innerHTML = scoreDetails(candidate);
        }
      }
      const log = document.querySelector('#detail [data-log]');
      if (log) {
        log.textContent = (job.log || []).map(item => `[${item.time}] ${item.message}`).join('\n');
        log.scrollTop = log.scrollHeight;
      }
      syncPlayButtons();

    function average(values) {
      const nums = values.map(Number).filter(Number.isFinite);
      return nums.length ? nums.reduce((sum, value) => sum + value, 0) / nums.length : null;
    }

    function groupAverage(records, field, valueField = 'score') {
      const groups = new Map();
      records.forEach(record => {
        const key = record[field] || 'Unsorted';
        if (!groups.has(key)) groups.set(key, []);
        const value = Number(record[valueField]);
        if (Number.isFinite(value)) groups.get(key).push(value);
      });
      return Array.from(groups.entries())
        .map(([label, values]) => ({ label, value: average(values), count: values.length }))
        .filter(row => row.value !== null)
        .sort((a, b) => b.value - a.value || b.count - a.count || a.label.localeCompare(b.label));
    }

    function countBy(records, getter) {
      const counts = new Map();
      records.forEach(record => {
        const key = getter(record);
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      return Array.from(counts.entries())
        .map(([label, value]) => ({ label, value }))
        .sort((a, b) => Number(a.label) - Number(b.label) || String(a.label).localeCompare(String(b.label)));
    }

    function axisAverages(records) {
      const labels = {
        SC_structural_coherence: 'Structural',
        MI_motivic_integration: 'Motivic',
        BP_beauty_spatial_poise: 'Beauty',
        EG_evolving_grammar: 'Grammar',
        CD_carry_depth: 'Carry'
      };
      return Object.entries(labels).map(([key, label]) => ({
        label,
        value: average(records.map(record => record.axes?.[key]))
      })).filter(row => row.value !== null).sort((a, b) => b.value - a.value);
    }

    function barChart(rows, { max = null, fill = '', digits = 2, limit = 12 } = {}) {
      const visibleRows = rows.slice(0, limit);
      const maxValue = max ?? Math.max(1, ...visibleRows.map(row => Number(row.value) || 0));
      if (!visibleRows.length) return '<div class="empty">No chart data available.</div>';
      return visibleRows.map(row => {
        const value = Number(row.value) || 0;
        const width = Math.max(0, Math.min(100, (value / maxValue) * 100));
        return `
          <div class="bar-row" title="${escapeHtml(row.label)}">
            <div class="bar-label">${escapeHtml(row.label)}${row.count ? ` (${row.count})` : ''}</div>
            <div class="bar-track"><div class="bar-fill ${fill}" style="width:${width}%"></div></div>
            <div class="bar-value">${fmt(value, digits)}</div>
          </div>
        `;
      }).join('');
    }

    function scoreHistogram(records) {
      const rows = countBy(records.filter(record => Number.isFinite(Number(record.score))), record => {
        const score = Math.max(0, Math.min(9, Math.floor(Number(record.score))));
        return `${score}-${score + 1}`;
      });
      return barChart(rows, { fill: 'warm', digits: 0 });
    }

    function formatDuration(seconds) {
      const total = Number(seconds);
      if (!Number.isFinite(total)) return '—';
      const rounded = Math.max(0, Math.round(total));
      const minutes = Math.floor(rounded / 60);
      const secs = rounded % 60;
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }

    function averageScoreFromAxes(axes) {
      const values = Object.values(axes || {}).map(Number).filter(Number.isFinite);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
    }

    function titleFromPath(path) {
      return String(path || '').split('/').pop()?.replace(/\.[^.]+$/, '') || 'Untitled';

      return `/media?path=${encodeURIComponent(path)}`;

      return String(key || '')
        .replace(/^SC_/, '')
        .replace(/^MI_/, '')
        .replace(/^BP_/, '')
        .replace(/^EG_/, '')
        .replace(/^CD_/, '')
        .replaceAll('_', ' ');
    }

    function reportDefinitionRows(rows) {
      return `<dl>${rows
        .filter(([, value]) => value !== undefined && value !== null && value !== '')
        .map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`)
        .join('')}</dl>`;

    function reportList(items) {
      const rows = (items || []).filter(Boolean);
      return rows.length ? `<ul>${rows.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<div class="meta">No notes available.</div>';
    }

    function reportAxisTable(scoring, baseScoring) {
      const axes = scoring.axes || {};
      const baseAxes = baseScoring.axes || {};
      const adjusted = scoring !== baseScoring;
      const rows = Object.entries(axes).map(([key, value]) => {
        const baseValue = Number(baseAxes[key]);
        const valueNumber = Number(value);
        const delta = Number.isFinite(baseValue) && Number.isFinite(valueNumber) ? valueNumber - baseValue : null;
        return `
          <tr>
            <td>${escapeHtml(axisLabel(key))}</td>
            <td>${fmt(value, 2)}</td>
            ${adjusted ? `<td>${fmt(baseValue, 2)}</td><td>${delta === null ? '—' : `${delta >= 0 ? '+' : ''}${fmt(delta, 2)}`}</td>` : ''}
          </tr>
        `;
      }).join('');
      if (!rows) return '<div class="meta">No axis scores available.</div>';
      return `
        <table>
          <thead><tr><th>Axis</th><th>Score</th>${adjusted ? '<th>Base</th><th>Delta</th>' : ''}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

        </table>
      `;

            <div class="report-panel report-wide">
              <h3>Framework Scores${llm.available ? ' (LLM-adjusted)' : ''}</h3>
              <div class="score-summary">
                ${core.CDPD !== undefined ? scoreChip('CDPD', core.CDPD, 2) : ''}
                ${core.NGE !== undefined ? scoreChip('NGE', core.NGE, 2) : ''}
                ${core.HMII_peak_estimate !== undefined ? scoreChip('HMII', core.HMII_peak_estimate, 0) : ''}
                <div class="score-chip"><strong>${escapeHtml(framework.name || '—')}</strong><span>Framework</span></div>
              </div>
              ${reportAxisTable(scoring, baseScoring)}
            </div>
            ${llm.available ? `
              <div class="report-panel report-wide">
                <h3>LLM Adjustments</h3>
                ${reportList(adjustments)}
                ${llm.review_flags?.length ? `<h3 style="margin-top:14px">Review Flags</h3>${reportList(llm.review_flags)}` : ''}
              </div>
            ` : ''}
            <div class="report-panel">
              <h3>Evolving Grammar Signals</h3>
              ${reportDefinitionRows([
                ['Section contrast', fmt(egEvidence.section_contrast_score, 2)],
                ['Cumulative evolution', fmt(egEvidence.cumulative_evolution_score, 2)],
                ['Transformed returns', fmt(egEvidence.transformed_return_score, 2)],
                ['Grid deviation', fmt(egEvidence.controlled_grid_deviation_score, 2)],
                ['Rule changes', fmt(egEvidence.rule_change_score, 2)],
                ['Production intent', fmt(egEvidence.production_transform_score, 2)],
                ['Overall', fmt(egEvidence.overall_score, 2)]
              ])}
            </div>
            <div class="report-panel">
              <h3>Beat Grid</h3>
              ${reportDefinitionRows([
                ['Available', audio.beat_this?.available ? 'yes' : 'no'],
                ['Beats', audio.beat_this?.beat_count],
                ['Downbeats', audio.beat_this?.downbeat_count],
                ['Tempo', audio.beat_this?.tempo_bpm ? `${fmt(audio.beat_this.tempo_bpm, 1)} BPM` : ''],
                ['Beat stability', fmt(audio.beat_this?.beat_grid_stability, 2)],
                ['Bar stability', fmt(audio.beat_this?.bar_grid_stability, 2)]
              ])}
            </div>
            <div class="report-panel report-wide">
              <h3>Rationale</h3>
              ${reportList(scoring.rationale || baseScoring.rationale)}
            </div>
            <div class="report-panel report-wide">
              <h3>Section Map</h3>
              ${reportSectionTable(audio.detected_sections)}
            </div>
          </div>
        </div>
      `;
      syncPlayButtons();
    }

    async function showAnalysisReport(reportPath) {
      $('detail').className = '';
      $('detail').innerHTML = '<div class="empty">Loading report...</div>';
      try {
        const report = await api(`/media?path=${encodeURIComponent(reportPath)}`);
        renderAnalysisReport(report, reportPath);
      } catch (err) {
        $('detail').innerHTML = `<div class="empty" style="color:var(--error)">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderDetail(job) {
      const best = job.best || {};
      const iterations = job.iterations || [];
      const callbackBase = job.settings?.public_base_url || '';
      const vocalGender = job.settings?.vocal_gender || 'unspecified';
      $('detail').className = '';
      $('detail').innerHTML = `
        <div class="topline">
          <div>
            <h2 style="margin:0 0 4px;font-size:20px">${job.song_text}</h2>
            <div class="meta">${job.id}</div>
          </div>
          <span data-job-status class="${statusClass(job.status)}">${job.status}</span>
        </div>
        <div class="summary">
          <div class="metric"><strong data-best-score>${fmt(best.score, 3)}</strong><span>Best Score</span></div>
          <div class="metric"><strong>${job.settings?.threshold ?? '—'}</strong><span>Threshold</span></div>
          <div class="metric"><strong>${iterations.length}</strong><span>Iterations</span></div>
          <div class="metric"><strong>${job.settings?.live ? 'Live' : 'Dry'}</strong><span>Mode</span></div>
        </div>
        ${callbackBase ? `<div class="meta" style="margin-bottom:14px">Callback base: ${callbackBase}</div>` : ''}
        <div class="meta" style="margin-bottom:14px">Suno controls: styleWeight ${job.settings?.style_weight ?? '0.75'} · weirdnessConstraint ${job.settings?.weirdness_constraint ?? '0.75'} · vocalGender ${escapeHtml(vocalGender)}</div>
        ${job.error ? `<div class="empty" style="color:var(--error);margin-bottom:14px">${job.error}</div>` : ''}
        <div data-iterations>${iterations.map(renderIteration).join('') || '<div class="empty">No iterations yet.</div>'}</div>
        <div class="log" data-log>${(job.log || []).map(item => `[${item.time}] ${item.message}`).join('\n')}</div>
      `;
      state.selectedSignature = jobSignature(job);
      syncPlayButtons();
    }

    function renderIteration(iteration) {
      const candidates = iteration.candidates || [];
      return `
        <div class="iteration" data-iteration="${iteration.iteration}">
          <div class="iteration-head">
            <strong>Iteration ${iteration.iteration}</strong>
            <span data-iteration-status="${iteration.iteration}" class="${statusClass(iteration.status)}">${iteration.status || 'pending'}</span>
          </div>
          <div class="iteration-body" data-iteration-body="${iteration.iteration}">
            ${iteration.task_id ? `<div class="meta">Task: ${iteration.task_id}</div>` : ''}
            ${iteration.text_path ? `<div class="meta">Text: ${escapeHtml(iteration.text_path)}</div>` : ''}
            ${iteration.revision_notes?.length ? `<div class="meta">${iteration.revision_notes.join(' ')}</div>` : ''}
            ${candidates.map(candidate => renderCandidate(candidate, iteration.iteration)).join('') || `<div class="meta" data-candidates-empty>Waiting for candidates.</div>`}
          </div>
        </div>
      `;
    }

    function candidateKey(iterationNumber, candidateIndex) {
      return `${iterationNumber}-${candidateIndex}`;
    }

    function candidateStatusText(candidate) {
      if (candidate.promoted) return 'winner';
      if (candidate.score !== undefined && candidate.score !== null) return fmt(candidate.score, 3);
      if (candidate.analysis_status === 'pending') return 'pending';
      return candidate.analysis_status || '—';
    }

    function scoreChip(label, value, digits = 2) {
      return `
        <div class="score-chip">
          <strong>${fmt(value, digits)}</strong>
          <span>${escapeHtml(label)}</span>
        </div>
      `;
    }

    function axisTable(candidate) {
      const axes = candidate.axes || {};
      const rows = Object.entries(axes).map(([key, value]) => `<tr><td>${escapeHtml(key)}</td><td>${fmt(value)}</td></tr>`).join('');
      if (!rows) return '';
      return `<table><thead><tr><th>Axis</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function scoreDetails(candidate) {
      const core = candidate.core_metrics || {};
      const rung = candidate.rung_estimate || {};
      const hasScore = candidate.score !== undefined && candidate.score !== null;
      const hasCore = Object.keys(core).length > 0;
      const hasRung = rung && (rung.number !== undefined || rung.label);
      const axes = axisTable(candidate);
      const summary = [
        hasScore ? scoreChip('Overall', candidate.score, 3) : '',
        hasRung ? `
          <div class="score-chip">
            <strong>${escapeHtml(rung.number ?? '—')}</strong>
            <span>${escapeHtml(rung.label || 'Rung')}</span>
          </div>
        ` : '',
        core.CDPD !== undefined ? scoreChip('CDPD', core.CDPD, 2) : '',
        core.NGE !== undefined ? scoreChip('NGE', core.NGE, 2) : '',
        core.HMII_peak_estimate !== undefined ? scoreChip('HMII', core.HMII_peak_estimate, 0) : ''
      ].filter(Boolean).join('');
      if (!summary && !axes) {
        return candidate.analysis_status ? `<div class="meta">Analysis ${escapeHtml(candidate.analysis_status)}.</div>` : '';
      }
      return `
        <div class="score-details">
          ${summary ? `<div class="score-summary">${summary}</div>` : ''}
          ${axes}
          ${hasCore ? `<div class="meta">${Object.entries(core).map(([key, value]) => `${escapeHtml(key)}: ${fmt(value, 3)}`).join(' · ')}</div>` : ''}
        </div>
      `;
    }

    function reportLink(candidate) {
      return candidate.report_path ? `<a href="/media?path=${encodeURIComponent(candidate.report_path)}" target="_blank">Analysis JSON</a>` : '';
    }

    function renderCandidate(candidate, iterationNumber) {
      const cover = candidate.image_url
        ? `<img class="cover" src="${candidate.image_url}" alt="">`
        : `<div class="cover placeholder">♪</div>`;
      const promoted = Boolean(candidate.promoted);
      const title = candidate.title || 'Candidate';
      return `
        <div class="candidate ${promoted ? 'promoted' : ''}" data-candidate-key="${candidateKey(iterationNumber, candidate.index)}">
          ${cover}
          <div>
            <div style="display:flex;justify-content:space-between;gap:10px">
              <strong>${escapeHtml(candidate.title || 'Candidate')}</strong>
              <span data-score-status class="status">${candidateStatusText(candidate)}</span>
            </div>
            <div class="meta">${candidate.duration ? `${fmt(candidate.duration, 1)}s` : ''} ${escapeHtml(candidate.tags || '')}</div>
            <span data-report-link>${reportLink(candidate)}</span>
            <div class="candidate-actions">
              ${candidate.audio_url ? `<button class="secondary" type="button" data-play-audio data-audio-url="${escapeHtml(candidate.audio_url)}" data-track-title="${escapeHtml(title)}" data-track-meta="${escapeHtml(`Iteration ${iterationNumber} · Candidate ${candidate.index}`)}">Play</button>` : ''}
              ${candidate.audio_url ? `<button class="${promoted ? 'secondary' : 'danger'}" type="button" data-promote data-iteration="${iterationNumber}" data-candidate="${candidate.index}" ${promoted ? 'disabled' : ''}>${promoted ? 'Selected Winner' : 'Pick Winner'}</button>` : ''}
              ${candidate.album_audio_path ? `<span class="meta">Moved to ${escapeHtml(candidate.album_audio_path)}</span>` : ''}
            </div>
            <div data-score-details>${scoreDetails(candidate)}</div>
          </div>
        </div>
      `;
    }

    function syncPlayButtons() {
      const audio = $('globalAudio');
      const currentUrl = state.currentTrack?.url || '';
      const playing = currentUrl && !audio.paused && !audio.ended;
      document.querySelectorAll('[data-play-audio]').forEach(button => {
        const isCurrent = button.dataset.audioUrl === currentUrl;
        button.classList.toggle('playing', Boolean(isCurrent && playing));
        button.textContent = isCurrent && playing ? 'Now Playing' : 'Play';
      });
      renderPlaylist();
    }

    function trackFromButton(button) {
      return {
        url: button.dataset.audioUrl,
        title: button.dataset.trackTitle || 'Selected track',
        meta: button.dataset.trackMeta || ''
      };
    }

    function albumTracksForPlaylist(album) {
      return (album?.tracks || [])
        .filter(track => track.audio_url)
        .map(track => ({
          url: track.audio_url,
          title: track.title || 'Untitled',
          meta: track.audio_path || album.name || ''
        }));
    }

    function playlistItemId() {
      state.playlistSerial += 1;
      return `${Date.now()}-${state.playlistSerial}`;
    }

    function addToPlaylist(track, { startIfIdle = true } = {}) {
      if (!track?.url) return;
      const wasEmpty = state.playlist.length === 0;
      state.playlist.push({ ...track, id: playlistItemId() });
      if (wasEmpty) state.currentPlaylistIndex = 0;
      renderPlaylist();
      if (startIfIdle && (wasEmpty || !$('globalAudio').getAttribute('src'))) {
        playPlaylistIndex(state.currentPlaylistIndex);
      }
    }

    function addManyToPlaylist(tracks) {
      const playable = (tracks || []).filter(track => track?.url);
      if (!playable.length) return;
      const wasEmpty = state.playlist.length === 0;
      playable.forEach(track => state.playlist.push({ ...track, id: playlistItemId() }));
      if (wasEmpty) {
        state.currentPlaylistIndex = 0;
        playPlaylistIndex(0);
      } else {
        renderPlaylist();
      }
    }

    function setPlayerTrack(track) {
      const audio = $('globalAudio');
      if (!track?.url) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        state.currentTrack = null;
        $('playerTitle').textContent = 'No track selected';
        $('playerMeta').textContent = 'Use a Play button to add tracks to the playlist.';
        return;
      }
      if (audio.getAttribute('src') !== track.url) {
        audio.src = track.url;
        audio.load();
      }
      audio.currentTime = 0;
      state.currentTrack = track;
      $('playerTitle').textContent = track.title;
      $('playerMeta').textContent = track.meta || track.url;
    }

    async function playPlaylistIndex(index) {
      const audio = $('globalAudio');
      if (!state.playlist.length) {
        state.currentPlaylistIndex = -1;
        setPlayerTrack(null);
        syncPlayButtons();
        return;
      }
      const normalizedIndex = ((index % state.playlist.length) + state.playlist.length) % state.playlist.length;
      state.currentPlaylistIndex = normalizedIndex;
      setPlayerTrack(state.playlist[normalizedIndex]);
      syncPlayButtons();
      try {
        await audio.play();
      } catch (err) {
        alert(err.message);
      } finally {
        syncPlayButtons();
      }
    }

    function advancePlaylist() {
      if (!state.playlist.length) return;
      playPlaylistIndex(state.currentPlaylistIndex + 1);
    }

    function removePlaylistItem(id) {
      const index = state.playlist.findIndex(item => item.id === id);
      if (index < 0) return;
      const removingCurrent = index === state.currentPlaylistIndex;
      state.playlist.splice(index, 1);
      if (!state.playlist.length) {
        state.currentPlaylistIndex = -1;
        setPlayerTrack(null);
        syncPlayButtons();
        return;
      }
      if (index < state.currentPlaylistIndex) {
        state.currentPlaylistIndex -= 1;
      } else if (removingCurrent) {
        state.currentPlaylistIndex = Math.min(index, state.playlist.length - 1);
        playPlaylistIndex(state.currentPlaylistIndex);
        return;
      }
      renderPlaylist();
      syncPlayButtons();
    }

    function renderPlaylist() {
      const count = state.playlist.length;
      $('playlistCount').textContent = count ? `${count} queued` : 'Playlist empty';
      $('playlistList').innerHTML = count ? state.playlist.map((track, index) => `
        <div class="playlist-item ${index === state.currentPlaylistIndex ? 'active' : ''}">
          <div class="playlist-item-title">
            <strong>${escapeHtml(track.title)}</strong>
            <span>${escapeHtml(track.meta || track.url)}</span>
          </div>
          <button class="danger" type="button" data-remove-playlist="${escapeHtml(track.id)}">Remove</button>
        </div>
      `).join('') : '<div class="playlist-item"><div class="playlist-item-title"><span>No queued tracks.</span></div></div>';
    }

    async function promoteCandidate(iteration, candidateIndex, overwrite = false) {
      if (!state.selected) return;
      const res = await fetch(`/api/jobs/${state.selected}/promote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ iteration, candidate_index: candidateIndex, overwrite })
      });
      const data = await res.json();
      if (res.status === 409 && data.exists) {
        if (confirm(`${data.destination} already exists. Replace it with this candidate?`)) {
          return promoteCandidate(iteration, candidateIndex, true);
        }
        return;
      }
      if (!res.ok) throw new Error(data.error || data.message || res.statusText);
      state.selectedSignature = '';
      await loadJob(state.selected, { soft: false });
    }

    async function startJob(event) {
      event.preventDefault();
      if (state.busy) return;
      state.busy = true;
      $('startBtn').disabled = true;
      try {
        const payload = {
          song_text: $('songText').value,
          public_base_url: $('publicBase').value.trim(),
          threshold: Number($('threshold').value),
          score_mode: $('scoreMode').value,
          max_iterations: Number($('maxIterations').value),
          max_api_calls: Number($('maxCalls').value),
          style_weight: Number($('styleWeight').value),
          weirdness_constraint: Number($('weirdnessConstraint').value),
          vocal_gender: $('vocalGender').value,
          live: $('live').checked,
          ollama_model: $('ollamaModel').value.trim()
        };
        const job = await api('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        state.selected = job.id;
        state.view = 'jobs';
        updateViewButtons();
        await loadJobs(true);
      } catch (err) {
        alert(err.message);
      } finally {
        state.busy = false;
        $('startBtn').disabled = false;
      }
    }

    $('jobForm').addEventListener('submit', startJob);
    $('jobsViewBtn').addEventListener('click', async () => {
      state.view = 'jobs';
      updateViewButtons();
      if (state.selected) await loadJob(state.selected, { soft: false });
      else $('detail').innerHTML = '<div class="empty">No job selected.</div>';
    });
    $('statsViewBtn').addEventListener('click', () => showStatistics().catch(err => alert(err.message)));
    $('analyzeTextBtn').addEventListener('click', analyzeSelectedText);
    $('songText').addEventListener('change', () => {
      $('textAnalysis').hidden = true;
      $('textAnalysis').innerHTML = '';
    });
    $('refreshBtn').addEventListener('click', async () => {
      state.selectedSignature = '';
      await loadJobs(true);
    });
    document.addEventListener('click', async (event) => {
      const albumButton = event.target.closest('[data-album-name]');
      if (albumButton) {
        await showAlbumDetail(albumButton.dataset.albumName);
        return;
      }
      const reportButton = event.target.closest('[data-report-path]');
      if (reportButton) {
        await showAnalysisReport(reportButton.dataset.reportPath);
        return;
      }
      const backButton = event.target.closest('[data-statistics-back]');
      if (backButton) {
        renderStatistics();
        return;
      }
      const albumPlayButton = event.target.closest('[data-play-album]');
      if (albumPlayButton) {
        addManyToPlaylist(albumTracksForPlaylist(state.selectedAlbumDetail));
        return;
      }
      const playButton = event.target.closest('[data-play-audio]');
      if (playButton) {
        addToPlaylist(trackFromButton(playButton));
        return;
      }
      const removePlaylistButton = event.target.closest('[data-remove-playlist]');
      if (removePlaylistButton) {
        removePlaylistItem(removePlaylistButton.dataset.removePlaylist);
        return;
      }
      const button = event.target.closest('[data-promote]');
      if (!button || button.disabled) return;
      const iteration = Number(button.dataset.iteration);
      const candidate = Number(button.dataset.candidate);
      if (!confirm(`Move candidate ${candidate} into the album audio folder and update the album text file with this iteration's text?`)) return;
      button.disabled = true;
      button.textContent = 'Moving...';
      try {
        await promoteCandidate(iteration, candidate);
      } catch (err) {
        alert(err.message);
        button.disabled = false;
        button.textContent = 'Pick Winner';
      }
    });
    $('globalAudio').addEventListener('play', syncPlayButtons);
    $('globalAudio').addEventListener('pause', syncPlayButtons);
    $('globalAudio').addEventListener('ended', advancePlaylist);

    (async function init() {
      try {
        await loadConfig();
        await loadSongs();
        await loadJobs(false);
        setInterval(() => loadJobs(true).catch(() => {}), 5000);
      } catch (err) {
        $('serverState').textContent = 'error';
        $('serverState').className = 'status error';
        $('detail').textContent = err.message;
      }
    })();
  </script>
</body>
</html>
