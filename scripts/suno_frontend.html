<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno Pipeline</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f1;
      --panel: #ffffff;
      --ink: #20231f;
      --muted: #686e65;
      --line: #d9ddd2;
      --accent: #1d6b5f;
      --accent-2: #a43f45;
      --soft: #e9efe9;
      --warn: #8b5e14;
      --ok: #1d6b3e;
      --error: #a12b2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-bottom: 92px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-actions button {
      min-height: 32px;
      padding: 5px 10px;
    }
    .header-actions button.active {
      background: var(--accent);
      color: #fff;
    }
    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcf8;
      padding: 18px;
      overflow: auto;
    }
    section {
      padding: 20px 24px 32px;
      overflow: auto;
    }
    label {
      display: block;
      margin: 12px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
      font: inherit;
    }
    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      margin: 0;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
      color: var(--ink);
      font-weight: 600;
    }
    .check span { line-height: 1.2; }
    button {
      min-height: 36px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 7px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
    }
    button.danger {
      background: #fff;
      border-color: var(--accent-2);
      color: var(--accent-2);
    }
    button:disabled {
      opacity: .55;
      cursor: wait;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .text-analysis {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 12px;
    }
    .text-analysis h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    .text-analysis dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      margin: 8px 0;
      font-size: 12px;
    }
    .text-analysis dt {
      color: var(--muted);
      font-weight: 700;
    }
    .text-analysis dd {
      margin: 0;
      font-weight: 700;
    }
    .warnings {
      margin: 8px 0 0;
      padding-left: 17px;
      color: var(--warn);
      font-size: 12px;
    }
    .jobs {
      margin-top: 22px;
      display: grid;
      gap: 8px;
    }
    .job {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      cursor: pointer;
    }
    .job.active {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .job-title {
      font-weight: 700;
      word-break: break-word;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status.complete, .status.dry-run-complete { color: var(--ok); }
    .status.error { color: var(--error); }
    .status.running, .status.queued { color: var(--warn); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric, .iteration, .candidate, .log {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .metric {
      padding: 11px 12px;
    }
    .metric strong {
      display: block;
      font-size: 18px;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .stats-toolbar {
      display: flex;
      gap: 10px;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .stats-toolbar label {
      margin-top: 0;
    }
    .stats-select {
      min-width: 180px;
    }
    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .chart-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      min-width: 0;
    }
    .chart-panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(86px, 150px) minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-weight: 700;
    }
    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }
    .bar-fill.alt { background: #3f5fa4; }
    .bar-fill.warm { background: #a45b3f; }
    .bar-value {
      text-align: right;
      font-weight: 800;
    }
    .scatter {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcf8;
    }
    .stats-table-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: auto;
    }
    .stats-table-wrap table {
      margin: 0;
      min-width: 760px;
    }
    .iteration {
      margin-bottom: 12px;
      overflow: hidden;
    }
    .iteration-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
    }
    .iteration-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .candidate {
      padding: 12px;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .candidate.promoted {
      border-color: var(--ok);
      box-shadow: inset 3px 0 0 var(--ok);
    }
    .cover {
      width: 88px;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--soft);
      object-fit: cover;
    }
    .placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
    }
    .global-player {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(180px, 340px) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 76px;
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      background: #fbfcf8;
      box-shadow: 0 -8px 24px rgba(32, 35, 31, .08);
    }
    .global-player-title {
      min-width: 0;
    }
    .global-player-title strong,
    .global-player-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .global-player-title span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .global-player audio {
      width: 100%;
      height: 36px;
    }
    button.playing {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .candidate-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .score-details {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .score-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 6px;
    }
    .score-chip {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: #fbfcf8;
    }
    .score-chip strong {
      display: block;
      font-size: 14px;
    }
    .score-chip span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 12px;
    }
    th, td {
      text-align: left;
      padding: 5px 6px;
      border-bottom: 1px solid var(--line);
    }
    th {
      color: var(--muted);
      font-weight: 800;
    }
    .log {
      margin-top: 14px;
      max-height: 220px;
      overflow: auto;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .empty {
      padding: 32px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 900px) {
      body { padding-bottom: 128px; }
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .summary { grid-template-columns: 1fr 1fr; }
      .charts { grid-template-columns: 1fr; }
      .candidate { grid-template-columns: 1fr; }
      .score-summary { grid-template-columns: 1fr 1fr; }
      .global-player {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Suno Pipeline</h1>
    <div class="header-actions">
      <button class="secondary active" id="jobsViewBtn" type="button">Jobs</button>
      <button class="secondary" id="statsViewBtn" type="button">Statistics</button>
      <span id="serverState" class="status">loading</span>
    </div>
  </header>
  <main>
    <aside>
      <form id="jobForm">
        <label for="songText">Seed Song</label>
        <select id="songText" required></select>

        <label for="publicBase">Public Base URL</label>
        <input id="publicBase" placeholder="https://your-domain.example">

        <div class="row">
          <div>
            <label for="threshold">Threshold</label>
            <input id="threshold" type="number" min="0" max="10" step="0.1" value="8.2">
          </div>
          <div>
            <label for="scoreMode">Score</label>
            <select id="scoreMode">
              <option value="mean_axes">Mean Axes</option>
              <option value="min_axis">Min Axis</option>
              <option value="cdpd">CDPD</option>
              <option value="nge">NGE</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="maxIterations">Iterations</label>
            <input id="maxIterations" type="number" min="1" max="20" value="3">
          </div>
          <div>
            <label for="maxCalls">API Calls</label>
            <input id="maxCalls" type="number" min="0" max="20" value="1">
          </div>
        </div>

        <label for="ollamaModel">Ollama Model</label>
        <input id="ollamaModel" value="qwen3:8b">

        <label class="check">
          <input id="live" type="checkbox">
          <span>Live Suno generation</span>
        </label>

        <div class="actions">
          <button id="startBtn" type="submit">Start Job</button>
          <button class="secondary" id="analyzeTextBtn" type="button">Analyze Text</button>
          <button class="secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div id="textAnalysis" class="text-analysis" hidden></div>
      </form>

      <div class="jobs" id="jobs"></div>
    </aside>
    <section>
      <div id="detail" class="empty">No job selected.</div>
    </section>
  </main>
  <div class="global-player" id="globalPlayer">
    <div class="global-player-title">
      <strong id="playerTitle">No track selected</strong>
      <span id="playerMeta">Use a card play button to load the player.</span>
    </div>
    <audio id="globalAudio" controls preload="metadata"></audio>
  </div>

  <script>
    const state = {
      jobs: [],
      selected: null,
      busy: false,
      selectedJob: null,
      selectedSignature: '',
      view: 'jobs',
      statistics: null,
      statsGroupBy: 'album',
      currentTrack: null
    };

    function $(id) { return document.getElementById(id); }

    async function api(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function statusClass(status) {
      return `status ${String(status || '').replaceAll('_', '-')}`;
    }

    function fmt(value, digits = 2) {
      const num = Number(value);
      return Number.isFinite(num) ? num.toFixed(digits) : '—';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function updateViewButtons() {
      $('jobsViewBtn').classList.toggle('active', state.view === 'jobs');
      $('statsViewBtn').classList.toggle('active', state.view === 'statistics');
    }

    async function loadSongs() {
      const data = await api('/api/songs');
      $('songText').innerHTML = data.songs.map(song =>
        `<option value="${song.path}">${song.path}</option>`
      ).join('');
    }

    async function loadConfig() {
      const data = await api('/api/config');
      if (data.public_base_url && !$('publicBase').value) {
        $('publicBase').value = data.public_base_url;
      }
    }

    async function analyzeSelectedText() {
      const panel = $('textAnalysis');
      panel.hidden = false;
      panel.innerHTML = '<h3>Text Analysis</h3><div class="meta">Analyzing seed text...</div>';
      $('analyzeTextBtn').disabled = true;
      try {
        const path = encodeURIComponent($('songText').value);
        const data = await api(`/api/text-analysis?path=${path}`);
        renderTextAnalysis(data);
      } catch (err) {
        panel.innerHTML = `<h3>Text Analysis</h3><div class="meta" style="color:var(--error)">${escapeHtml(err.message)}</div>`;
      } finally {
        $('analyzeTextBtn').disabled = false;
      }
    }

    function renderTextAnalysis(data) {
      const metrics = data.metrics || {};
      const suno = data.suno || {};
      const warnings = data.warnings || [];
      $('textAnalysis').hidden = false;
      $('textAnalysis').innerHTML = `
        <h3>${escapeHtml(data.title || 'Text Analysis')}</h3>
        <div class="meta">${escapeHtml(data.framework || 'No framework selected')}</div>
        <dl>
          <dt>Prompt chars</dt><dd>${suno.prompt_chars ?? '—'} / ${suno.prompt_limit ?? '—'}</dd>
          <dt>Style chars</dt><dd>${suno.style_chars ?? '—'} / ${suno.style_limit ?? '—'}</dd>
          <dt>Words</dt><dd>${metrics.word_count ?? '—'}</dd>
          <dt>Lines</dt><dd>${metrics.line_count ?? '—'}</dd>
          <dt>Sections</dt><dd>${metrics.section_count ?? '—'}</dd>
          <dt>Repeated lines</dt><dd>${fmt(metrics.repeated_line_ratio, 2)}</dd>
          <dt>Rhyme reuse</dt><dd>${fmt(metrics.rhyme_suffix_reuse, 2)}</dd>
          <dt>Audio target</dt><dd>${escapeHtml(data.album_audio_target || '—')}</dd>
        </dl>
        ${warnings.length ? `<ul class="warnings">${warnings.map(warning => `<li>${escapeHtml(warning)}</li>`).join('')}</ul>` : '<div class="meta" style="color:var(--ok)">Ready for Suno payload limits.</div>'}
      `;
    }

    async function loadJobs(keepSelection = true) {
      const data = await api('/api/jobs');
      state.jobs = data.jobs;
      if (!keepSelection || !state.selected) {
        state.selected = state.jobs[0]?.id || null;
      }
      renderJobs();
      if (state.selected && state.view === 'jobs') await loadJob(state.selected, { soft: true });
      $('serverState').textContent = 'online';
      $('serverState').className = 'status complete';
    }

    async function loadJob(id, options = {}) {
      const job = await api(`/api/jobs/${id}`);
      const selectionChanged = state.selected !== id;
      state.view = 'jobs';
      state.selected = id;
      updateViewButtons();
      updateDetail(job, { soft: Boolean(options.soft) && !selectionChanged });
      renderJobs();
    }

    function jobSignature(job) {
      return JSON.stringify({
        status: job.status,
        updated_at: job.updated_at,
        completed_at: job.completed_at,
        error: job.error || '',
        best: job.best?.score ?? null,
        iterations: (job.iterations || []).map(iteration => ({
          iteration: iteration.iteration,
          status: iteration.status,
          candidates: (iteration.candidates || []).map(candidate => ({
            index: candidate.index,
            score: candidate.score ?? null,
            audio_path: candidate.audio_path || '',
            report_path: candidate.report_path || '',
            analysis_status: candidate.analysis_status || '',
            axes: candidate.axes || {},
            core_metrics: candidate.core_metrics || {},
            rung_estimate: candidate.rung_estimate || null,
            promoted: Boolean(candidate.promoted),
            album_audio_path: candidate.album_audio_path || ''
          }))
        })),
        winner: job.winner || null
      });
    }

    function updateDetail(job, { soft = false } = {}) {
      const signature = jobSignature(job);
      state.selectedJob = job;
      if (soft && signature === state.selectedSignature) {
        return;
      }
      state.selectedSignature = signature;
      renderDetail(job);
    }

    function updateTextOnly(job) {
      const status = document.querySelector('#detail [data-job-status]');
      if (status) {
        status.textContent = job.status || 'unknown';
        status.className = statusClass(job.status);
      }
      const best = document.querySelector('#detail [data-best-score]');
      if (best) best.textContent = fmt(job.best?.score, 3);
      for (const iteration of job.iterations || []) {
        const iterationsRoot = document.querySelector('#detail [data-iterations]');
        if (!document.querySelector(`#detail [data-iteration="${iteration.iteration}"]`) && iterationsRoot) {
          const empty = iterationsRoot.querySelector('.empty');
          if (empty) empty.remove();
          iterationsRoot.insertAdjacentHTML('beforeend', renderIteration(iteration));
        }
        const iterationStatus = document.querySelector(`#detail [data-iteration-status="${iteration.iteration}"]`);
        if (iterationStatus) {
          iterationStatus.textContent = iteration.status || 'pending';
          iterationStatus.className = statusClass(iteration.status);
        }
        for (const candidate of iteration.candidates || []) {
          const key = candidateKey(iteration.iteration, candidate.index);
          let row = document.querySelector(`#detail [data-candidate-key="${key}"]`);
          if (!row) {
            const body = document.querySelector(`#detail [data-iteration-body="${iteration.iteration}"]`);
            if (!body) continue;
            const empty = body.querySelector('[data-candidates-empty]');
            if (empty) empty.remove();
            body.insertAdjacentHTML('beforeend', renderCandidate(candidate, iteration.iteration));
            row = document.querySelector(`#detail [data-candidate-key="${key}"]`);
            if (!row) continue;
          }
          const score = row.querySelector('[data-score-status]');
          if (score) score.textContent = candidateStatusText(candidate);
          const report = row.querySelector('[data-report-link]');
          if (report) report.innerHTML = reportLink(candidate);
          const details = row.querySelector('[data-score-details]');
          if (details) details.innerHTML = scoreDetails(candidate);
        }
      }
      const log = document.querySelector('#detail [data-log]');
      if (log) {
        log.textContent = (job.log || []).map(item => `[${item.time}] ${item.message}`).join('\n');
        log.scrollTop = log.scrollHeight;
      }
      syncPlayButtons();
    }

    function renderJobs() {
      $('jobs').innerHTML = state.jobs.map(job => `
        <div class="job ${job.id === state.selected ? 'active' : ''}" data-job="${job.id}">
          <div class="job-title">${job.song_text}</div>
          <div class="meta">${job.created_at || ''}</div>
          <div style="margin-top:8px"><span class="${statusClass(job.status)}">${job.status || 'unknown'}</span></div>
        </div>
      `).join('');
      document.querySelectorAll('.job').forEach(el => {
        el.addEventListener('click', () => loadJob(el.dataset.job));
      });
    }

    function average(values) {
      const nums = values.map(Number).filter(Number.isFinite);
      return nums.length ? nums.reduce((sum, value) => sum + value, 0) / nums.length : null;
    }

    function groupAverage(records, field, valueField = 'score') {
      const groups = new Map();
      records.forEach(record => {
        const key = record[field] || 'Unsorted';
        if (!groups.has(key)) groups.set(key, []);
        const value = Number(record[valueField]);
        if (Number.isFinite(value)) groups.get(key).push(value);
      });
      return Array.from(groups.entries())
        .map(([label, values]) => ({ label, value: average(values), count: values.length }))
        .filter(row => row.value !== null)
        .sort((a, b) => b.value - a.value || b.count - a.count || a.label.localeCompare(b.label));
    }

    function countBy(records, getter) {
      const counts = new Map();
      records.forEach(record => {
        const key = getter(record);
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      return Array.from(counts.entries())
        .map(([label, value]) => ({ label, value }))
        .sort((a, b) => Number(a.label) - Number(b.label) || String(a.label).localeCompare(String(b.label)));
    }

    function axisAverages(records) {
      const labels = {
        SC_structural_coherence: 'Structural',
        MI_motivic_integration: 'Motivic',
        BP_beauty_spatial_poise: 'Beauty',
        EG_evolving_grammar: 'Grammar',
        CD_carry_depth: 'Carry'
      };
      return Object.entries(labels).map(([key, label]) => ({
        label,
        value: average(records.map(record => record.axes?.[key]))
      })).filter(row => row.value !== null).sort((a, b) => b.value - a.value);
    }

    function barChart(rows, { max = null, fill = '', digits = 2, limit = 12 } = {}) {
      const visibleRows = rows.slice(0, limit);
      const maxValue = max ?? Math.max(1, ...visibleRows.map(row => Number(row.value) || 0));
      if (!visibleRows.length) return '<div class="empty">No chart data available.</div>';
      return visibleRows.map(row => {
        const value = Number(row.value) || 0;
        const width = Math.max(0, Math.min(100, (value / maxValue) * 100));
        return `
          <div class="bar-row" title="${escapeHtml(row.label)}">
            <div class="bar-label">${escapeHtml(row.label)}${row.count ? ` (${row.count})` : ''}</div>
            <div class="bar-track"><div class="bar-fill ${fill}" style="width:${width}%"></div></div>
            <div class="bar-value">${fmt(value, digits)}</div>
          </div>
        `;
      }).join('');
    }

    function scoreHistogram(records) {
      const rows = countBy(records.filter(record => Number.isFinite(Number(record.score))), record => {
        const score = Math.max(0, Math.min(9, Math.floor(Number(record.score))));
        return `${score}-${score + 1}`;
      });
      return barChart(rows, { fill: 'warm', digits: 0 });
    }

    function scatterChart(records) {
      const points = records
        .map(record => ({ x: Number(record.tempo_bpm), y: Number(record.score), label: `${record.title} (${fmt(record.score, 2)})` }))
        .filter(point => Number.isFinite(point.x) && Number.isFinite(point.y));
      if (!points.length) return '<div class="empty">No tempo and score pairs available.</div>';
      const width = 640;
      const height = 360;
      const pad = 38;
      const minX = Math.min(...points.map(point => point.x));
      const maxX = Math.max(...points.map(point => point.x));
      const minY = 0;
      const maxY = 10;
      const xRange = Math.max(1, maxX - minX);
      const xFor = value => pad + ((value - minX) / xRange) * (width - pad * 2);
      const yFor = value => height - pad - ((value - minY) / (maxY - minY)) * (height - pad * 2);
      const circles = points.map(point => `
        <circle cx="${xFor(point.x).toFixed(1)}" cy="${yFor(point.y).toFixed(1)}" r="4" fill="#1d6b5f" opacity=".72">
          <title>${escapeHtml(point.label)} - ${fmt(point.x, 1)} BPM</title>
        </circle>
      `).join('');
      return `
        <svg class="scatter" viewBox="0 0 ${width} ${height}" role="img" aria-label="Tempo by score scatter plot">
          <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#d9ddd2"/>
          <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#d9ddd2"/>
          <text x="${pad}" y="${height - 10}" fill="#686e65" font-size="12">${fmt(minX, 0)} BPM</text>
          <text x="${width - pad - 56}" y="${height - 10}" fill="#686e65" font-size="12">${fmt(maxX, 0)} BPM</text>
          <text x="6" y="${pad + 4}" fill="#686e65" font-size="12">10</text>
          <text x="14" y="${height - pad + 4}" fill="#686e65" font-size="12">0</text>
          ${circles}
        </svg>
      `;
    }

    async function showStatistics(force = false) {
      state.view = 'statistics';
      updateViewButtons();
      $('detail').className = '';
      $('detail').innerHTML = '<div class="empty">Loading statistics...</div>';
      if (!state.statistics || force) {
        state.statistics = await api('/api/statistics');
      }
      renderStatistics();
    }

    function renderStatistics() {
      const records = state.statistics?.records || [];
      const summary = state.statistics?.summary || {};
      const groupRows = groupAverage(records, state.statsGroupBy);
      const topRows = records
        .filter(record => Number.isFinite(Number(record.score)))
        .slice()
        .sort((a, b) => Number(b.score) - Number(a.score))
        .slice(0, 20);
      $('detail').className = '';
      $('detail').innerHTML = `
        <div class="topline">
          <div>
            <h2 style="margin:0 0 4px;font-size:20px">Statistics</h2>
            <div class="meta">All analyzed JSON reports under this project.</div>
          </div>
          <button class="secondary" id="statsRefreshBtn" type="button">Refresh</button>
        </div>
        <div class="summary">
          <div class="metric"><strong>${summary.count ?? records.length}</strong><span>Results</span></div>
          <div class="metric"><strong>${fmt(summary.average_score, 2)}</strong><span>Avg Score</span></div>
          <div class="metric"><strong>${fmt(summary.average_rung, 2)}</strong><span>Avg Rung</span></div>
          <div class="metric"><strong>${fmt(summary.average_tempo_bpm, 1)}</strong><span>Avg BPM</span></div>
        </div>
        <div class="stats-toolbar">
          <div class="stats-select">
            <label for="statsGroupBy">Group Scores By</label>
            <select id="statsGroupBy">
              <option value="album" ${state.statsGroupBy === 'album' ? 'selected' : ''}>Album</option>
              <option value="framework" ${state.statsGroupBy === 'framework' ? 'selected' : ''}>Framework</option>
              <option value="source_type" ${state.statsGroupBy === 'source_type' ? 'selected' : ''}>Source</option>
            </select>
          </div>
        </div>
        ${records.length ? `
          <div class="charts">
            <div class="chart-panel"><h3>Average Axis Scores</h3>${barChart(axisAverages(records), { max: 10 })}</div>
            <div class="chart-panel"><h3>Score Distribution</h3>${scoreHistogram(records)}</div>
            <div class="chart-panel"><h3>Average Score by ${state.statsGroupBy.replace('_', ' ')}</h3>${barChart(groupRows, { max: 10, fill: 'alt' })}</div>
            <div class="chart-panel"><h3>Rung Distribution</h3>${barChart(countBy(records.filter(r => r.rung_number !== null), r => String(Math.round(Number(r.rung_number)))), { fill: 'warm', digits: 0 })}</div>
            <div class="chart-panel" style="grid-column:1 / -1"><h3>Tempo vs Score</h3>${scatterChart(records)}</div>
          </div>
          <div class="stats-table-wrap">
            <table>
              <thead><tr><th>Rank</th><th>Title</th><th>Album</th><th>Score</th><th>Rung</th><th>BPM</th><th>Framework</th><th>Report</th></tr></thead>
              <tbody>
                ${topRows.map((record, index) => `
                  <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(record.title)}</td>
                    <td>${escapeHtml(record.album)}</td>
                    <td>${fmt(record.score, 3)}</td>
                    <td>${record.rung_number ?? '—'} ${escapeHtml(record.rung_label || '')}</td>
                    <td>${fmt(record.tempo_bpm, 1)}</td>
                    <td>${escapeHtml(record.framework)}</td>
                    <td><a href="/media?path=${encodeURIComponent(record.report_path)}" target="_blank">JSON</a></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : '<div class="empty">No analyzed results found. Run the analyzer first to create analysis JSON reports.</div>'}
      `;
      $('statsRefreshBtn').addEventListener('click', () => showStatistics(true).catch(err => alert(err.message)));
      const selector = $('statsGroupBy');
      if (selector) {
        selector.addEventListener('change', () => {
          state.statsGroupBy = selector.value;
          renderStatistics();
        });
      }
    }

    function renderDetail(job) {
      const best = job.best || {};
      const iterations = job.iterations || [];
      const callbackBase = job.settings?.public_base_url || '';
      $('detail').className = '';
      $('detail').innerHTML = `
        <div class="topline">
          <div>
            <h2 style="margin:0 0 4px;font-size:20px">${job.song_text}</h2>
            <div class="meta">${job.id}</div>
          </div>
          <span data-job-status class="${statusClass(job.status)}">${job.status}</span>
        </div>
        <div class="summary">
          <div class="metric"><strong data-best-score>${fmt(best.score, 3)}</strong><span>Best Score</span></div>
          <div class="metric"><strong>${job.settings?.threshold ?? '—'}</strong><span>Threshold</span></div>
          <div class="metric"><strong>${iterations.length}</strong><span>Iterations</span></div>
          <div class="metric"><strong>${job.settings?.live ? 'Live' : 'Dry'}</strong><span>Mode</span></div>
        </div>
        ${callbackBase ? `<div class="meta" style="margin-bottom:14px">Callback base: ${callbackBase}</div>` : ''}
        ${job.error ? `<div class="empty" style="color:var(--error);margin-bottom:14px">${job.error}</div>` : ''}
        <div data-iterations>${iterations.map(renderIteration).join('') || '<div class="empty">No iterations yet.</div>'}</div>
        <div class="log" data-log>${(job.log || []).map(item => `[${item.time}] ${item.message}`).join('\n')}</div>
      `;
      state.selectedSignature = jobSignature(job);
      syncPlayButtons();
    }

    function renderIteration(iteration) {
      const candidates = iteration.candidates || [];
      return `
        <div class="iteration" data-iteration="${iteration.iteration}">
          <div class="iteration-head">
            <strong>Iteration ${iteration.iteration}</strong>
            <span data-iteration-status="${iteration.iteration}" class="${statusClass(iteration.status)}">${iteration.status || 'pending'}</span>
          </div>
          <div class="iteration-body" data-iteration-body="${iteration.iteration}">
            ${iteration.task_id ? `<div class="meta">Task: ${iteration.task_id}</div>` : ''}
            ${iteration.revision_notes?.length ? `<div class="meta">${iteration.revision_notes.join(' ')}</div>` : ''}
            ${candidates.map(candidate => renderCandidate(candidate, iteration.iteration)).join('') || `<div class="meta" data-candidates-empty>Waiting for candidates.</div>`}
          </div>
        </div>
      `;
    }

    function candidateKey(iterationNumber, candidateIndex) {
      return `${iterationNumber}-${candidateIndex}`;
    }

    function candidateStatusText(candidate) {
      if (candidate.promoted) return 'winner';
      if (candidate.score !== undefined && candidate.score !== null) return fmt(candidate.score, 3);
      if (candidate.analysis_status === 'pending') return 'pending';
      return candidate.analysis_status || '—';
    }

    function scoreChip(label, value, digits = 2) {
      return `
        <div class="score-chip">
          <strong>${fmt(value, digits)}</strong>
          <span>${escapeHtml(label)}</span>
        </div>
      `;
    }

    function axisTable(candidate) {
      const axes = candidate.axes || {};
      const rows = Object.entries(axes).map(([key, value]) => `<tr><td>${escapeHtml(key)}</td><td>${fmt(value)}</td></tr>`).join('');
      if (!rows) return '';
      return `<table><thead><tr><th>Axis</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function scoreDetails(candidate) {
      const core = candidate.core_metrics || {};
      const rung = candidate.rung_estimate || {};
      const hasScore = candidate.score !== undefined && candidate.score !== null;
      const hasCore = Object.keys(core).length > 0;
      const hasRung = rung && (rung.number !== undefined || rung.label);
      const axes = axisTable(candidate);
      const summary = [
        hasScore ? scoreChip('Overall', candidate.score, 3) : '',
        hasRung ? `
          <div class="score-chip">
            <strong>${escapeHtml(rung.number ?? '—')}</strong>
            <span>${escapeHtml(rung.label || 'Rung')}</span>
          </div>
        ` : '',
        core.CDPD !== undefined ? scoreChip('CDPD', core.CDPD, 2) : '',
        core.NGE !== undefined ? scoreChip('NGE', core.NGE, 2) : '',
        core.HMII_peak_estimate !== undefined ? scoreChip('HMII', core.HMII_peak_estimate, 0) : ''
      ].filter(Boolean).join('');
      if (!summary && !axes) {
        return candidate.analysis_status ? `<div class="meta">Analysis ${escapeHtml(candidate.analysis_status)}.</div>` : '';
      }
      return `
        <div class="score-details">
          ${summary ? `<div class="score-summary">${summary}</div>` : ''}
          ${axes}
          ${hasCore ? `<div class="meta">${Object.entries(core).map(([key, value]) => `${escapeHtml(key)}: ${fmt(value, 3)}`).join(' · ')}</div>` : ''}
        </div>
      `;
    }

    function reportLink(candidate) {
      return candidate.report_path ? `<a href="/media?path=${encodeURIComponent(candidate.report_path)}" target="_blank">Analysis JSON</a>` : '';
    }

    function renderCandidate(candidate, iterationNumber) {
      const cover = candidate.image_url
        ? `<img class="cover" src="${candidate.image_url}" alt="">`
        : `<div class="cover placeholder">♪</div>`;
      const promoted = Boolean(candidate.promoted);
      const title = candidate.title || 'Candidate';
      return `
        <div class="candidate ${promoted ? 'promoted' : ''}" data-candidate-key="${candidateKey(iterationNumber, candidate.index)}">
          ${cover}
          <div>
            <div style="display:flex;justify-content:space-between;gap:10px">
              <strong>${escapeHtml(candidate.title || 'Candidate')}</strong>
              <span data-score-status class="status">${candidateStatusText(candidate)}</span>
            </div>
            <div class="meta">${candidate.duration ? `${fmt(candidate.duration, 1)}s` : ''} ${escapeHtml(candidate.tags || '')}</div>
            <span data-report-link>${reportLink(candidate)}</span>
            <div class="candidate-actions">
              ${candidate.audio_url ? `<button class="secondary" type="button" data-play-audio data-audio-url="${escapeHtml(candidate.audio_url)}" data-track-title="${escapeHtml(title)}" data-track-meta="${escapeHtml(`Iteration ${iterationNumber} · Candidate ${candidate.index}`)}">Play</button>` : ''}
              ${candidate.audio_url ? `<button class="${promoted ? 'secondary' : 'danger'}" type="button" data-promote data-iteration="${iterationNumber}" data-candidate="${candidate.index}" ${promoted ? 'disabled' : ''}>${promoted ? 'Selected Winner' : 'Pick Winner'}</button>` : ''}
              ${candidate.album_audio_path ? `<span class="meta">Moved to ${escapeHtml(candidate.album_audio_path)}</span>` : ''}
            </div>
            <div data-score-details>${scoreDetails(candidate)}</div>
          </div>
        </div>
      `;
    }

    function syncPlayButtons() {
      const audio = $('globalAudio');
      const currentUrl = state.currentTrack?.url || '';
      const playing = currentUrl && !audio.paused && !audio.ended;
      document.querySelectorAll('[data-play-audio]').forEach(button => {
        const isCurrent = button.dataset.audioUrl === currentUrl;
        button.classList.toggle('playing', Boolean(isCurrent && playing));
        button.textContent = isCurrent && playing ? 'Now Playing' : 'Play';
      });
    }

    async function playCandidate(button) {
      const audio = $('globalAudio');
      const url = button.dataset.audioUrl;
      if (!url) return;
      const title = button.dataset.trackTitle || 'Selected track';
      const meta = button.dataset.trackMeta || '';
      const sameTrack = state.currentTrack?.url === url;
      audio.pause();
      if (!sameTrack || audio.getAttribute('src') !== url) {
        audio.src = url;
        audio.load();
      }
      audio.currentTime = 0;
      state.currentTrack = { url, title, meta };
      $('playerTitle').textContent = title;
      $('playerMeta').textContent = meta || url;
      syncPlayButtons();
      try {
        await audio.play();
      } catch (err) {
        alert(err.message);
      } finally {
        syncPlayButtons();
      }
    }

    async function promoteCandidate(iteration, candidateIndex, overwrite = false) {
      if (!state.selected) return;
      const res = await fetch(`/api/jobs/${state.selected}/promote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ iteration, candidate_index: candidateIndex, overwrite })
      });
      const data = await res.json();
      if (res.status === 409 && data.exists) {
        if (confirm(`${data.destination} already exists. Replace it with this candidate?`)) {
          return promoteCandidate(iteration, candidateIndex, true);
        }
        return;
      }
      if (!res.ok) throw new Error(data.error || data.message || res.statusText);
      state.selectedSignature = '';
      await loadJob(state.selected, { soft: false });
    }

    async function startJob(event) {
      event.preventDefault();
      if (state.busy) return;
      state.busy = true;
      $('startBtn').disabled = true;
      try {
        const payload = {
          song_text: $('songText').value,
          public_base_url: $('publicBase').value.trim(),
          threshold: Number($('threshold').value),
          score_mode: $('scoreMode').value,
          max_iterations: Number($('maxIterations').value),
          max_api_calls: Number($('maxCalls').value),
          live: $('live').checked,
          ollama_model: $('ollamaModel').value.trim()
        };
        const job = await api('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        state.selected = job.id;
        state.view = 'jobs';
        updateViewButtons();
        await loadJobs(true);
      } catch (err) {
        alert(err.message);
      } finally {
        state.busy = false;
        $('startBtn').disabled = false;
      }
    }

    $('jobForm').addEventListener('submit', startJob);
    $('jobsViewBtn').addEventListener('click', async () => {
      state.view = 'jobs';
      updateViewButtons();
      if (state.selected) await loadJob(state.selected, { soft: false });
      else $('detail').innerHTML = '<div class="empty">No job selected.</div>';
    });
    $('statsViewBtn').addEventListener('click', () => showStatistics().catch(err => alert(err.message)));
    $('analyzeTextBtn').addEventListener('click', analyzeSelectedText);
    $('songText').addEventListener('change', () => {
      $('textAnalysis').hidden = true;
      $('textAnalysis').innerHTML = '';
    });
    $('refreshBtn').addEventListener('click', async () => {
      state.selectedSignature = '';
      await loadJobs(true);
    });
    document.addEventListener('click', async (event) => {
      const playButton = event.target.closest('[data-play-audio]');
      if (playButton) {
        await playCandidate(playButton);
        return;
      }
      const button = event.target.closest('[data-promote]');
      if (!button || button.disabled) return;
      const iteration = Number(button.dataset.iteration);
      const candidate = Number(button.dataset.candidate);
      if (!confirm(`Move candidate ${candidate} into the album audio folder as the winning take?`)) return;
      button.disabled = true;
      button.textContent = 'Moving...';
      try {
        await promoteCandidate(iteration, candidate);
      } catch (err) {
        alert(err.message);
        button.disabled = false;
        button.textContent = 'Pick Winner';
      }
    });
    $('globalAudio').addEventListener('play', syncPlayButtons);
    $('globalAudio').addEventListener('pause', syncPlayButtons);
    $('globalAudio').addEventListener('ended', syncPlayButtons);

    (async function init() {
      try {
        await loadConfig();
        await loadSongs();
        await loadJobs(false);
        setInterval(() => loadJobs(true).catch(() => {}), 5000);
      } catch (err) {
        $('serverState').textContent = 'error';
        $('serverState').className = 'status error';
        $('detail').textContent = err.message;
      }
    })();
  </script>
</body>
</html>
